name: pecunia
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 2.0.4+35

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.3

  go_router: ^18.1.4

  cupertino_ui: 1.1.7
  material_ui: 1.11.1

  file_picker: ^13.4.1

  json_annotation: ^4.12.0

  google_fonts: ^9.0.0
  shared_preferences: ^2.5.6
  fl_chart: ^1.3.1
  package_info_plus: ^10.2.2
  sqflite: ^2.4.6
  url_launcher: ^6.3.3

  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.17.1
  json_serializable: ^6.15.2

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

  riverpod_generator: ^4.0.10
  sqflite_common_ffi: ^2.4.7

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon/play_store_512.png"
  min_sdk_android: 23
  image_path_android: "assets/app_icon/ic_launcher.png"
  adaptive_icon_background: "assets/app_icon/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/app_icon/ic_launcher_foreground.png"

flutter_native_splash:
  color: "#000000"
  image: assets/app_icon/splash_icon.png
  android: true
  ios: true
  ios_content_mode: center
  android_gravity: center
  android_12:
    color: "#000000"
    image: assets/app_icon/splash_icon.png

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/app_icon/
    - assets/png/
